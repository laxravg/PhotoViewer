<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi visor de fotos</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, sans-serif; margin: 0; }
    header { display: flex; justify-content: space-between; align-items: center;
             padding: 12px 20px; border-bottom: 1px solid #8884; }
    h1 { font-size: 1.1rem; margin: 0; }
    main { padding: 20px; max-width: 1100px; margin: 0 auto; }
    form { display: grid; gap: 8px; max-width: 320px; margin: 40px auto; }
    input, button { padding: 8px; font: inherit; }
    #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 8px; margin-top: 16px; }
    #grid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px;
                cursor: zoom-in; }
    #lightbox { position: fixed; inset: 0; background: #000d; display: flex;
                align-items: center; justify-content: center; cursor: zoom-out; }
    #lightbox img { max-width: 95vw; max-height: 95vh; }
    [hidden] { display: none !important; }
    #msg { min-height: 1.4em; }
  </style>
</head>
<body>
  <header>
    <h1>Mi visor de fotos</h1>
    <button id="logout" hidden>Salir</button>
  </header>
  <main>
    <form id="login">
      <input id="email" type="email" placeholder="Email" required>
      <input id="password" type="password" placeholder="Contraseña" required>
      <button>Entrar</button>
    </form>
    <section id="app" hidden>
      <input id="file" type="file" accept="image/jpeg,image/png" multiple>
      <div id="grid"></div>
    </section>
    <p id="msg"></p>
  </main>
  <div id="lightbox" hidden><img id="big" alt=""></div>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
